<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game-IC | เกม PPE</title>
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;

    .box { padding:40px 24px; max-width:520px; }
    .icon { font-size:72px; }
    h1 { font-size:42px; margin:10px 0; }
    p { font-size:18px; line-height:1.6; opacity:.95; }
    .badge { display:inline-block; margin-top:20px; padding:12px 28px; border-radius:999px;
             background:#fff; color:#0f766e; font-weight:bold; font-size:18px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">🧤😷🥽</div>
    <h1>Game-IC</h1>
    <p>เกมฝึกการใส่และถอดอุปกรณ์ป้องกันส่วนบุคคล (PPE)<br>อย่างถูกวิธี เพื่อการป้องกันการติดเชื้อ</p>
    <div class="badge">🚧 เร็ว ๆ นี้ 🚧</div>
  </div>
</body>
</html>
